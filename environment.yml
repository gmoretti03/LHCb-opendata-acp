# Environment used for all the results of the report (macOS arm64, 2026-10).
#   conda env create -f environment.yml && conda activate lhcb-kkk
#   python -m ipykernel install --user --name cern     # the notebooks use the kernel name "cern"
name: lhcb-kkk
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - numpy=2.4.6
  - scipy=1.18.0
  - pandas=3.0.3
  - matplotlib=3.11.0
  - uproot=5.7.5
  - awkward=2.9.1
  - iminuit=2.32.0
  - emcee=3.1.6
  - corner=2.3.0
  - scikit-learn=1.9.0
  - pillow=12.3.0
  - tqdm=4.68.3
  - jupyter_core=5.9.1
  - nbconvert=7.17.1
  - ipykernel=7.3.0
  - tectonic            # only to compile the report
  - pip
  - pip:
      - tensorflow==2.21.0
      - keras==3.15.1
