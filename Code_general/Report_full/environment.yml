# Environment of the three notebooks.
#   conda env create -f environment.yml && conda activate lhcb-kkk
#   python -m ipykernel install --user --name cern      # the notebooks use the kernel name "cern"
name: lhcb-kkk
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pandas
  - matplotlib
  - uproot
  - awkward
  - iminuit=2.32
  - emcee=3.1
  - corner
  - scikit-learn
  - jupyter
  - ipykernel
  - pip
  - pip:
      - tensorflow==2.21.0
